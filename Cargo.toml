[workspace]
members = [
    "crates/linorun-core",
    "crates/linorun-macros",
    "crates/linorun-testkit",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
futures-channel = "0.3.34"
futures-core = "0.3.34"
futures-executor = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
proc-macro2 = "1.0.101"
quote = "1.0.40"
linorun-core = { version = "0.1.0", path = "crates/linorun-core" }
syn = { version = "2.0.106", features = ["full"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
